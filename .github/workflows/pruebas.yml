# Cada vez que haces push, GitHub ejecuta tus pruebas en una máquina limpia.
# Si todas pasan, tu commit muestra una marca verde ✔; si alguna falla, una ✘ roja.
name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Java 27
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Ejecutar las pruebas
        run: mvn -B test
